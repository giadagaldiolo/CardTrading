<!DOCTYPE html>
<main th:replace="~{fragments/layout :: layout(
    pageTitle=${card.cname + ' - SUPSI card online shop'},
    headerTitle=${card.cname + ' details'},
    pageDescription=${card.cname + ' details in SUPSI card online shop'},
    additionalCss=null,
    pageScripts=null,
    pageContent=~{:: content}
)}">
    <section th:fragment="content" class="container py-4">
        <h2 class="mb-4" th:text="${card.cname}">Card 1</h2>
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <div th:text="'Seller: ' + ${card.author} + ' | Announcement date: '+ ${card.date}">
                    Seller: Tommaso | Announcement date: <time datetime="2025-03-03">03/03/2025</time>
                </div>
                <div>
                    <a class="btn btn-primary me-2" th:href="@{'/card/'+${card.id}+'/edit'}">Edit</a>
                    <a class="btn btn-danger" th:href="@{'/card/'+${card.id}+'/delete'}">Delete</a>
                </div>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-4 d-flex justify-content-center mb-3 mb-md-0">
                        <img class="img-fluid rounded" th:src="${card.base64Image}" th:alt="${card.cname}">
                    </div>
                    <div class="col-md-8">
                        <div class="mb-3">
                            <h5 class="card-title">Name:</h5>
                            <p class="card-text" th:text="${card.cname}">Black Lotus</p>
                        </div>
                        <div class="mb-3">
                            <h5 class="card-title">State:</h5>
                            <p class="card-text" th:text="${card.condition}">Near Mint</p>
                        </div>
                        <div class="mb-3">
                            <h5 class="card-title">Description:</h5>
                            <p class="card-text" th:text="${card.description}">
                                Adds 3 mana of any single color of your choice to your mana pool, then is discarded. Tapping this artifact can be played as an interrupt.
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>
>
