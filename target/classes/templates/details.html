<!DOCTYPE html>
<main th:replace="~{fragments/layout :: layout(
    pageTitle=${card.cname + ' - SUPSI card online shop'},
    headerTitle=${card.cname + ' details'},
    pageDescription=${card.cname + ' details in SUPSI card online shop'},
    additionalCss=null,
    pageScripts=null,
    pageContent=~{:: content}
)}" xmlns:sec="http://www.w3.org/1999/xhtml">
    <section th:fragment="content" class="container py-4">
        <h2 class="mb-4" th:text="${card.cname}">Card 1</h2>
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <div th:text="'Seller: ' + ${card.ownerUser.username} + ' | Announcement date: '+ ${card.date}">
                    Seller: Tommaso | Announcement date: <time datetime="2025-03-03">03/03/2025</time>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <div sec:authorize="hasRole('ROLE_ADMIN')">
                        <a class="btn btn-primary me-2" th:href="@{'/card/'+${card.id}+'/edit'}">Edit</a>
                        <a class="btn btn-danger" th:href="@{'/card/'+${card.id}+'/delete'}" onclick="return confirm('Sei sicuro di voler eliminare la carta?');">Delete</a>
                    </div>
                    <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-2">
                        <form th:if="${inWishlist}" th:action="@{'/wishlist/delete/' + ${card.id}}" method="post" class="m-0 p-0">
                            <button type="submit" class="btn btn-link p-0 border-0" title="Remove from wishlist" style="font-size: 1.5rem;">
                                <i class="bi bi-heart-fill text-danger"></i>
                            </button>
                        </form>

                        <form th:unless="${inWishlist}" th:action="@{'/wishlist/add/' + ${card.id}}" method="post" class="m-0 p-0">
                            <button type="submit" class="btn btn-link p-0 border-0" title="Add to wishlist" style="font-size: 1.5rem;">
                                <i class="bi bi-heart text-muted"></i>
                            </button>
                        </form>

                        <form th:if="${inCart}" th:action="@{'/cart/delete/' + ${card.id}}" method="post" class="m-0 p-0">
                            <button type="submit" class="btn btn-outline-danger">
                                Remove from cart
                            </button>
                        </form>

                        <form th:unless="${inCart}" th:action="@{'/cart/add/' + ${card.id}}" method="post" class="m-0 p-0">
                            <button type="submit" class="btn btn-outline-primary">
                                Add to cart
                            </button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-4 d-flex justify-content-center mb-3 mb-md-0">
                        <img class="img-fluid rounded" th:src="${card.base64Image}" th:alt="${card.cname}">
                    </div>
                    <div class="col-md-8">
                        <div class="mb-3">
                            <h5 class="card-title">Name:</h5>
                            <p class="card-text" th:text="${card.cname}">Black Lotus</p>
                        </div>
                        <div class="mb-3">
                            <h5 class="card-title">State:</h5>
                            <p class="card-text" th:text="${card.cardCondition}">Near Mint</p>
                        </div>
                        <div class="mb-3">
                            <h5 class="card-title">Description:</h5>
                            <p class="card-text" th:text="${card.description}">
                                Adds 3 mana of any single color of your choice to your mana pool, then is discarded. Tapping this artifact can be played as an interrupt.
                            </p>
                        </div>
                        <div class="mb-3">
                            <h5 class="card-title">Price:</h5>
                            <p class="card-text" th:text="${card.price}">10.00</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>
