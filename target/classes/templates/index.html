<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>SUPSI Card Online Shop</title>
        <meta name="author" content="Giada Galdiolo">
        <meta name="date" content="2025-03-11" scheme="YYYY-MM-DD">
        <meta name="description" content="SUPSI card online shop">
        <meta charset="UTF-8">
        <meta name="keywords" content="buy, sell, card, shop">
        <link rel="stylesheet" type="text/css" href="/CSS/common.css" />
        <link rel="stylesheet" type="text/css" href="/CSS/indexStyle.css">
    </head>
    <body>
        <header>
            <img class="logo" src="/images/newLogo.png" alt="logo">
            <h1> SUPSI Card Online shop </h1>
        </header>
        <div th:replace="fragments/navbar :: navbar"></div>
        <main>
            <section>
                <h2> Card announcements </h2>
                <ul class="announcementsList">
                    <li th:each="card : ${cards}">
                        <a th:href="@{'/card/' + ${card.id}}" th:text="${card.cname}"></a>
                    </li>
                </ul>
            </section>
        </main>
        <aside>
            <h2>News</h2>
            <ul>
                <li class="news">
                    #PP3 | Added register form with JS validation
                </li>
                <li class="news">
                    #PP2 | New version of the platform with CSS
                </li>
                <li class="news">
                    #PP1 | First version online!
                </li>
            </ul>
        </aside>
        <footer>
            <hr>
            <small> SUPSI card online shop - Copyleft CC-by <time datetime="2025">2025</time> by Giada </small>
            <hr>
        </footer>
    </body>
</html>
