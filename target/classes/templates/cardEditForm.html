<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>SUPSI Card Online Shop - Edit Card</title>
    <meta name="author" content="Giada Galdiolo">
    <meta name="date" content="2025-03-11" scheme="YYYY-MM-DD">
    <meta name="description" content="form to edit a card in the SUPSI card online shop">
    <meta charset="UTF-8">
    <meta name="keywords" content="edit, card, shop">
    <link rel="stylesheet" type="text/css" href="/CSS/common.css"/>
    <link rel="stylesheet" type="text/css" href="/CSS/cardSaleStyle.css" />
</head>
<body>
<header>
    <img class="logo" src="/images/newLogo.png" alt="logo">
    <h1>Edit Card</h1>
</header>
<div th:replace="fragments/navbar :: navbar"></div>
<main>
    <form method="post" th:action="@{/card/{id}/edit(id=${card.id})}" th:object="${card}">
        <fieldset>
            <legend>Edit your card</legend>
            <input type="hidden" th:field="*{id}"/>
            <div>
                <label for="cname">Card name:</label><br>
                <input type="text" id="cname" th:field="*{cname}">
            </div>
            <div>
                <label for="author">Author:</label><br>
                <input type="text" id="author" th:field="*{author}">
            </div>
            <div>
                <label for="date">Date:</label><br>
                <input type="date" id="date" th:field="*{date}">
            </div>
            <div>
                <label for="condition">Condition</label>
                <select id="condition" th:field="*{condition}">
                    <option value="">Select Condition</option>
                    <option value="MINT">Mint</option>
                    <option value="NEAR_MINT">Near Mint</option>
                    <option value="EXCELLENT">Excellent</option>
                    <option value="GOOD">Good</option>
                    <option value="LIGHT_PLAYED">Light Played</option>
                    <option value="PLAYED">Played</option>
                    <option value="POOR">Poor</option>
                </select>
            </div>
            <div>
                <label for="description">Descriptive text:</label>
                <textarea id="description" th:field="*{description}"></textarea>
            </div>
            <div>
                <label for="image">Select the card image:</label>
                <input type="file" id="image" name="image">
            </div>
        </fieldset>
        <input type="submit" value="Save Changes">
    </form>
</main>
<aside>
    <h2>News</h2>
    <ul>
        <li class="news">
            #PP3 | Added register form with JS validation
        </li>
        <li class="news">
            #PP2 | New version of the platform with CSS
        </li>
        <li class="news">
            #PP1 | First version online!
        </li>
    </ul>
</aside>
<footer>
    <hr>
    <small>SUPSI card online shop - Copyleft CC-by <time datetime="2025">2025</time> by Giada</small>
    <hr>
</footer>
</body>
</html>
