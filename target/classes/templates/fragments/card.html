<div class="card trading-card" th:fragment="card(card)">
    <div class="card-header">
        <h3 class="card-title card-name" th:text="${card.cname}">Name</h3>
    </div>
    <div class="card-body">
        <div class="d-flex justify-content-center align-items-center">
            <img class="img-fluid" th:src="${card.base64Image}" th:alt="${card.cname}" />
        </div>
        <div class="card-body-badge d-flex justify-content-center align-items-center gap-2 mt-3">
            <span class="badge bg-secondary card-type" th:text="${card.cardType}">Type</span>
            <span class="badge card-condition"
                  th:classappend="${'condition-' + #strings.toLowerCase(#strings.replace(card.cardCondition, '_', '-'))}"
                  th:text="${#strings.toLowerCase(#strings.replace(card.cardCondition, '_', '-'))}">
            </span>
            <span class="badge bg-secondary card-price" th:text="${#numbers.formatDecimal(card.price, 1, 2)} + ' CHF'">Price</span>
        </div>
    </div>
    <div class="card-footer">
        <p class="card-text card-description" th:text="${card.description}">Description</p>
        <div>
            <p class="card-date mt-2" th:text="${card.date}">Date</p>
        </div>
    </div>
</div>
