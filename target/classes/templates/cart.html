<!DOCTYPE html>
<main th:replace="~{fragments/layout :: layout(
    pageTitle='Cart',
    headerTitle='Your cart',
    pageDescription='Cards in your cart',
    additionalCss=null,
    pageScripts=null,
    pageContent=~{:: content}
)}">
    <section th:fragment="content">
        <h2>Your cart</h2>
        <div class="cards-container d-flex flex-wrap justify-content-center gap-3">
            <a th:each="card : ${cartCards}" th:href="@{'/card/' + ${card.id}}" class="card-link">
                <div th:replace="~{fragments/card :: card(${card})}"></div>
            </a>
        </div>
        <div class="mt-4 text-center">
            <h4>Total: <span th:text="${#numbers.formatDecimal(totalPrice, 1, 2)} + ' CHF'">Total: 0.00 CHF</span></h4>
        </div>
    </section>
</main>
