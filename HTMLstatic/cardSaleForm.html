<!DOCTYPE html>
<html lang="en">
    <head>
        <title>SUPSI Card Online Shop - Card Sale Form</title>
        <meta name="author" content="Giada Galdiolo">
        <meta name="date" content="2025-03-11" scheme="YYYY-MM-DD">
        <meta name="description" content="SUPSI card online shop">
        <meta charset="UTF-8">
        <link rel="stylesheet" type="text/css" href="CSS/common.css"/>
        <link rel="stylesheet" type="text/css" href="CSS/cardSaleStyle.css" />
    </head>
    <body>
        <header>
            <div style="display: flex; align-items: center">
                <img src="images/newLogo.png" width="450" height="200" alt="logo">
                <h1 style="margin-left: 20px;"> Card Sale Form </h1>
            </div>
        </header>
        <nav class="navbar">
            <hr>
            <a href="/index.html">Home </a> |
            <a> Card sale form</a> |
            <a href="/pikachuDetails.html">Pikachu details</a> |
            <a href="/bulbasaurDetails.html">Bulbasaur details</a> |
            <a href="/charmanderDetails.html">Charmander details</a>
            <hr>
        </nav>
        <form>
            <fieldset>
                <legend>Sell a card</legend>
                <div>
                    <label for="cname">Card name:</label><br>
                    <input type="text" id="cname" name="cname">
                </div>
                <div>
                    <label for="author">Author:</label><br>
                    <input type="text" id="author" name="author">
                </div>
                <div>
                    <label for="date">Date:</label><br>
                    <input type="date" id="date" name="date">
                </div>
                <div>
                    <label for="condition">Condition</label>
                    <select id="condition" name="condition">
                        <option value="">Select condition</option>
                        <option value="mint">mint</option>
                        <option value="near-mint">near-mint</option>
                        <option value="played">played</option>
                    </select>
                </div>
                <div>
                    <label for="descrizione">Descriptive text:</label>
                    <textarea name="descrizione" id="descrizione" rows="2" cols="20">write something</textarea>
                </div>
                <div>
                    <label for="file">Select the card image:</label>
                    <input type ="file" id="file" name="file">
                </div>
            </fieldset>
            <input type="submit" value="Submit">
        </form>

        <footer>
            <small> Copyleft CC-by 2025 by Giada </small>
        </footer>
    </body>
</html>
