<!DOCTYPE html>
<main th:replace="~{fragments/layout :: layout(
    pageTitle='Sell a Card - SUPSI card online shop',
    headerTitle='Sell a Card',
    pageDescription='Form to sell a card in the SUPSI card online shop',
    additionalCss=@{'/css/form.css'},
    pageScripts=null,
    pageContent=~{:: content}
)}">
    <section th:fragment="content" class="container pt-4">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <form th:action="@{/card/new}" th:object="${card}" method="post" enctype="multipart/form-data" class="needs-validation" novalidate>
                    <div class="card">
                        <div class="card-header">
                            <h2 class="h4 mb-0">Sell a Card</h2>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label for="name" class="form-label">Card name:</label>
                                <input type="text" class="form-control" id="name" th:field="*{cname}" required>
                                <div class="invalid-feedback">Please enter a valid card name.</div>
                            </div>
                            <div class="mb-3">
                                <label for="author" class="form-label">Author:</label>
                                <input type="text" class="form-control" id="author" th:field="*{author}" required>
                                <div class="invalid-feedback">Please enter the author's name.</div>
                            </div>
                            <div class="mb-3">
                                <label for="date" class="form-label">Date:</label>
                                <input type="date" class="form-control" id="date" th:field="*{date}" required>
                                <div class="invalid-feedback">Please select a date.</div>
                            </div>
                            <div class="mb-3">
                                <label for="condition" class="form-label">Card condition:</label>
                                <select class="form-select" th:field="*{condition}" id="condition" required>
                                    <option value="" disabled selected>Select condition</option>
                                    <option th:each="conditionOpt : ${T(ch.supsi.web.cardgames.model.CardCondition).values()}"
                                            th:value="${conditionOpt}"
                                            th:text="${conditionOpt}">Mint</option>
                                </select>
                                <div class="invalid-feedback">Please select a condition.</div>
                            </div>
                            <div class="mb-3">
                                <label for="type" class="form-label">Card Type:</label>
                                <select class="form-select" th:field="*{type}" id="type" required>
                                    <option value="" disabled selected>Select type</option>
                                    <option th:each="typeOpt : ${T(ch.supsi.web.cardgames.model.CardType).values()}"
                                            th:value="${typeOpt}"
                                            th:text="${typeOpt}">Pokemon</option>
                                </select>
                                <div class="invalid-feedback">Please select a card type.</div>
                            </div>
                            <div class="mb-3">
                                <label for="description" class="form-label">Description:</label>
                                <textarea class="form-control" id="description" th:field="*{description}" rows="3" required></textarea>
                                <div class="invalid-feedback">Please enter a description.</div>
                            </div>
                            <div class="mb-3">
                                <label for="image" class="form-label">Image:</label>
                                <input type="file" class="form-control" id="image" name="image" accept="image/*" required>
                                <div class="invalid-feedback">Please select an image.</div>
                            </div>
                        </div>
                        <div class="card-footer">
                            <button type="submit" class="btn btn-primary">Create</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </section>
</main>
