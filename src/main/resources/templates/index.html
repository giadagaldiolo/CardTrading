<!DOCTYPE html>
<main th:replace="~{fragments/layout :: layout(
    pageTitle='Card announcements',
    headerTitle='Card announcements',
    pageDescription='Card announcements',
    additionalCss=null,
    pageScripts=null,
    pageContent=~{:: content}
)}">
    <section th:fragment="content">
        <h2>Card announcements</h2>
        <div class="cards-container d-flex flex-column flex-md-row flex-wrap justify-content-center justify-content-lg-start align-items-center gap-3">
            <a th:each="card : ${cards}" th:href="@{'/card/' + ${card.id}}" class="card-link">
                <div th:replace="~{fragments/card :: card(${card})}"></div>
            </a>
        </div>
    </section>
</main>
